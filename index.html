function step(dt,n){if(pause>0){pause-=dt;if(pause<=0&&$('#half').classList.contains('show'))second();return}m+=dt*1.5;let lim=phase==1?45:90;if(m>=lim&&!add)add=phase==1?1+Math.floor(Math.random()*4):3+Math.floor(Math.random()*5);if(add&&m>=lim+add){if(phase==1){pause=2;$('#half').classList.add('show');$('#ev').textContent='DEVRE ARASI'}else finish()}G.a+=.38*dt;B.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;wall(b)});clash(B[0],B[1]);ui()}
